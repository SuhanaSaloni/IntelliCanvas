<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntelliCanvas UI</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    body { font-family: 'Space Grotesk', sans-serif; background:#0d0f1a; color:#e0e7ff; }
    .code-block { font-family: 'Space Mono', monospace; font-size: 11px; }
    .canvas-area { cursor: crosshair; }
    .canvas-area.tool-text { cursor: text; }
    .canvas-area.tool-image { cursor: copy; }
    .canvas-area.tool-video { cursor: copy; }
    .canvas-area.tool-circle { cursor: crosshair; }
    .drawn-el { position: absolute; overflow: hidden; border: 2px dashed rgba(99,102,241,0.7); background: rgba(99,102,241,0.08); display:flex; align-items:center; justify-content:center; }
    .drawn-el.circle { border-radius: 50%; }
    .drawn-el.tagged { border-style: solid; border-color: #6366f1; background: rgba(99,102,241,0.12); }
    .tag-popover { position: absolute; z-index: 50; }
    .preview-frame { border: 1px solid #5d7096; background: #fff; }
    .toolbar-btn { transition: all 0.15s; }
    .toolbar-btn.active { background: #6366f1 !important; color: #fff !important; }
    .canvas-text { position: absolute; background: transparent; border: 1px dashed #a5b4fc; color: #e0e7ff; padding: 4px 8px; min-width: 60px; outline: none; white-space: pre-wrap; word-break: break-word; }
    .canvas-img { position: absolute; border: 2px solid #6366f1; border-radius: 4px; object-fit: cover; }
    .canvas-video { position: absolute; border: 2px solid #6366f1; border-radius: 4px; object-fit: cover; }
    .section-maximized { position: fixed !important; inset: 0 !important; z-index: 200; width: 100vw !important; height: calc(100 * min(var(--vh,1vh),1vh)) !important; background: #10121f; overflow: auto; }
    .max-btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; background: #1e1b4b; color: #a5b4fc; border: none; font-size: 12px; }
    .max-btn:hover { background: #6366f1; color: #fff; }
    .color-swatch { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.15s; }
    .color-swatch:hover, .color-swatch.active { border-color: #fff; transform: scale(1.2); }
    .share-modal { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); }
    .share-modal.hidden { display: none; }
    .drawn-el .fn-heading { font-weight: 700; color: #e0e7ff; text-align: center; width: 100%; }
    .drawn-el .fn-button { background: #6366f1; color: #fff; border: none; border-radius: 6px; padding: 6px 16px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .drawn-el .fn-button:hover { background: #4f46e5; }
    .drawn-el .fn-input { border: 1.5px solid #cbd5e1; border-radius: 6px; padding: 6px 10px; font-size: 13px; width: 80%; background: #1e1b4b; color: #e0e7ff; outline: none; }
    .drawn-el .fn-paragraph { color: #a5b4fc; font-size: 12px; text-align: center; padding: 4px; }
    .drawn-el .fn-card { background: #1e1b4b; border-radius: 8px; width: 90%; height: 80%; display: flex; align-items: center; justify-content: center; color: #a5b4fc; font-size: 11px; }
    .drawn-el .fn-image { width: 100%; height: 100%; object-fit: cover; }
    .drawn-el .fn-checkbox, .drawn-el .fn-radio { accent-color: #6366f1; }
    .drawn-el .fn-select { border: 1.5px solid #cbd5e1; border-radius: 6px; padding: 4px 8px; font-size: 12px; background: #1e1b4b; color: #e0e7ff; }
    .drawn-el .fn-toggle { appearance: none; width: 36px; height: 20px; background: #cbd5e1; border-radius: 10px; position: relative; cursor: pointer; transition: 0.2s; }
    .drawn-el .fn-toggle:checked { background: #6366f1; }
    .drawn-el .fn-toggle::before { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: 0.2s; }
    .drawn-el .fn-toggle:checked::before { left: 18px; }
    .canva-header { background:#10121f; }
    .canva-text { color:#e0e7ff; }
    .canva-button { background:#6366f1; color:#fff; border:none; cursor:pointer; transition: background 0.15s; }
    .canva-button:hover { background:#4f46e5; }
  </style>
 </head>
 <body class="w-full min-h-screen flex flex-col overflow-hidden">
  <header class="canva-header flex items-center justify-between px-5 py-3 border-b border-gray-800">
   <h1 class="canva-text font-bold tracking-tight text-lg">IntelliCanvas UI</h1>
   <div class="flex items-center gap-3">
    <button class="canva-button px-3 py-1.5 rounded text-xs font-medium" onclick="openShareModal()">Share / Export</button>
   </div>
  </header>
  <main class="flex flex-1 overflow-hidden" id="main-layout">
   <section id="canvas-section" class="flex-1 relative overflow-hidden border-r border-gray-800 flex flex-col">
    <div class="flex items-center gap-1 px-3 py-2 border-b border-gray-800 bg-[#10121f] flex-wrap">
     <button class="canva-button toolbar-btn px-2.5 py-1.5 rounded text-xs font-medium" onclick="undoLast()" title="Undo">Undo</button>
     <div class="w-px h-5 bg-gray-700 mx-1"></div>
     <button id="tool-draw" class="toolbar-btn px-2.5 py-1.5 rounded text-xs font-medium bg-gray-800 text-gray-300 hover:bg-gray-700" onclick="setTool('draw')" title="Freehand"><i data-lucide="pencil" style="width:14px;height:14px;display:inline"></i></button>
     <button id="tool-rect" class="toolbar-btn px-2.5 py-1.5 rounded text-xs font-medium bg-gray-800 text-gray-300 hover:bg-gray-700 active" onclick="setTool('rect')" title="Rectangle"><i data-lucide="square" style="width:14px;height:14px;display:inline"></i></button>
     <button id="tool-circle" class="toolbar-btn px-2.5 py-1.5 rounded text-xs font-medium bg-gray-800 text-gray-300 hover:bg-gray-700" onclick="setTool('circle')" title="Circle"><i data-lucide="circle" style="width:14px;height:14px;display:inline"></i></button>
     <button id="tool-text" class="toolbar-btn px-2.5 py-1.5 rounded text-xs font-medium bg-gray-800 text-gray-300 hover:bg-gray-700" onclick="setTool('text')" title="Text"><i data-lucide="type" style="width:14px;height:14px;display:inline"></i></button>
     <button id="tool-image" class="toolbar-btn px-2.5 py-1.5 rounded text-xs font-medium bg-gray-800 text-gray-300 hover:bg-gray-700" onclick="setTool('image')" title="Image"><i data-lucide="image" style="width:14px;height:14px;display:inline"></i></button>
     <button id="tool-video" class="toolbar-btn px-2.5 py-1.5 rounded text-xs font-medium bg-gray-800 text-gray-300 hover:bg-gray-700" onclick="setTool('video')" title="Video"><i data-lucide="video" style="width:14px;height:14px;display:inline"></i></button>
     <div class="w-px h-5 bg-gray-700 mx-1"></div>
     <div class="flex items-center gap-1" id="color-palette"></div>
     <div class="w-px h-5 bg-gray-700 mx-1"></div>
     <select id="text-size-select" class="bg-gray-800 text-gray-300 text-xs rounded px-2 py-1 border border-gray-700" title="Text Size">
       <option value="12">12px</option><option value="14">14px</option><option value="16" selected>16px</option>
       <option value="20">20px</option><option value="24">24px</option><option value="32">32px</option><option value="48">48px</option>
     </select>
     <div class="flex-1"></div>
     <button class="max-btn" onclick="toggleMax('canvas-section')" title="Maximize">⛶</button>
     <button class="canva-button px-3 py-1.5 rounded text-xs font-medium ml-2" onclick="clearAll()">Clear</button>
    </div>
    <div id="canvas-area" class="canvas-area flex-1 relative bg-[#0d0f1a]" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
     <svg id="grid-svg" class="absolute inset-0 w-full h-full pointer-events-none opacity-20">
      <defs>
       <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.5" />
       </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)" />
     </svg>
     <svg id="draw-svg" class="absolute inset-0 w-full h-full pointer-events-none" style="z-index:5;"></svg>
     <div id="elements-layer" class="absolute inset-0" style="z-index:10;"></div>
    </div>
    <div id="tag-popover" class="tag-popover hidden bg-gray-900 border border-gray-700 rounded-lg p-3 shadow-xl">
     <p class="text-xs text-gray-400 mb-2 font-medium">Tag this element:</p>
     <div class="grid grid-cols-3 gap-1.5" id="tag-options"></div>
    </div>
    <div id="video-url-modal" class="hidden fixed inset-0 z-[250] flex items-center justify-center bg-black/60">
     <div class="bg-gray-900 border border-gray-700 rounded-lg p-5 w-80">
      <p class="text-sm text-gray-200 mb-3 font-medium">Enter video URL (mp4, webm, or embed)</p>
      <input id="video-url-input" type="url" placeholder="https://..." class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm text-gray-200 outline-none focus:border-indigo-500 mb-3">
      <div class="flex gap-2 justify-end">
       <button class="px-3 py-1.5 rounded text-xs bg-gray-700 text-gray-300 hover:bg-gray-600" onclick="closeVideoModal()">Cancel</button>
       <button class="px-3 py-1.5 rounded text-xs bg-indigo-600 text-white hover:bg-indigo-500" onclick="confirmVideo()">Insert</button>
      </div>
     </div>
    </div>
   </section>
   <aside id="sidebar-section" class="w-[380px] flex flex-col bg-[#10121f] overflow-hidden">
    <div class="p-4 border-b border-gray-800 flex items-center justify-between">
     <h2 class="canva-text font-semibold text-sm">Layers</h2>
     <div class="flex items-center gap-2">
      <span id="el-count" class="text-xs text-indigo-400 font-mono">0 elements</span>
      <button class="max-btn" onclick="toggleMax('sidebar-section')" title="Maximize">⛶</button>
     </div>
    </div>
    <div id="element-list-section" class="flex flex-col overflow-hidden">
     <div class="flex items-center justify-between px-3 pt-2">
      <span class="text-[10px] text-gray-500 uppercase tracking-wider">Elements</span>
      <button class="max-btn" onclick="toggleMax('element-list-section')" title="Maximize" style="width:20px;height:20px;font-size:10px;">⛶</button>
     </div>
     <div id="element-list" class="overflow-y-auto p-3 space-y-1.5 max-h-[180px]"></div>
    </div>
    <div class="p-4 border-t border-gray-800">
     <button class="canva-button w-full py-2.5 rounded-lg font-semibold text-sm" onclick="compile()">Compile to Code</button>
    </div>
    <div id="code-panel-section" class="flex-1 flex flex-col overflow-hidden border-t border-gray-800">
     <div class="flex border-b border-gray-800">
      <button id="tab-code" class="flex-1 py-2 text-xs font-medium text-indigo-400 border-b-2 border-indigo-500" onclick="switchTab('code')">Code</button>
      <button id="tab-preview" class="flex-1 py-2 text-xs font-medium text-gray-500" onclick="switchTab('preview')">Preview</button>
      <button class="max-btn m-1" onclick="toggleMax('code-panel-section')" title="Maximize">⛶</button>
     </div>
     <div id="panel-code" class="flex-1 overflow-auto p-3">
      <pre id="code-output" class="code-block text-green-300 whitespace-pre-wrap text-[10px] leading-relaxed"></pre>
     </div>
     <div id="panel-preview" class="flex-1 overflow-auto p-3 hidden"><iframe id="preview-frame" class="preview-frame w-full h-full min-h-[200px] rounded"></iframe>
     </div>
    </div>
   </aside>
  </main>
  <div id="share-modal" class="share-modal hidden">
   <div class="bg-gray-900 border border-gray-700 rounded-xl p-6 w-96 max-w-[90vw]">
    <div class="flex items-center justify-between mb-4">
     <h3 class="text-white font-semibold text-sm">Share / Export</h3>
     <button class="text-gray-400 hover:text-white" onclick="closeShareModal()"><i data-lucide="x" style="width:18px;height:18px"></i></button>
    </div>
    <div class="space-y-3">
     <button class="w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm" onclick="exportCanvas()"><i data-lucide="image" style="width:16px;height:16px"></i> Export Sketch as Image</button>
     <button class="w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm" onclick="exportCode()"><i data-lucide="code" style="width:16px;height:16px"></i> Download Generated Code</button>
     <button class="w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm" onclick="copyCode()"><i data-lucide="copy" style="width:16px;height:16px"></i> Copy Code to Clipboard</button>
     <button class="w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm" onclick="nativeShare()"><i data-lucide="share" style="width:16px;height:16px"></i> Share via System</button>
    </div>
   </div>
  </div>
  <script>
lucide.createIcons();

const COLORS = ['#6366f1','#ef4444','#f59e0b','#10b981','#3b82f6','#ec4899','#8b5cf6','#06b6d4','#ffffff','#64748b'];
const palette = document.getElementById('color-palette');
let selectedColor = '#6366f1';
COLORS.forEach(c => {
  const s = document.createElement('div');
  s.className = 'color-swatch' + (c===selectedColor?' active':'');
  s.style.background = c;
  s.onclick = () => {
    palette.querySelectorAll('.color-swatch').forEach(x=>x.classList.remove('active'));
    s.classList.add('active');
    selectedColor = c;
  };
  palette.appendChild(s);
});

const TAGS = ['heading','button','input','card','image','paragraph','checkbox','radio','dropdown','toggle','video'];
let elements = [];
let currentTool = 'rect';
let drawing = false, startX=0, startY=0, currentEl=null, pendingShape=null;
let drawPath = [], drawSvgPath = null;
let videoInsertX=0, videoInsertY=0;

const canvas = document.getElementById('canvas-area');
const layer = document.getElementById('elements-layer');
const drawSvg = document.getElementById('draw-svg');
const popover = document.getElementById('tag-popover');
const tagOpts = document.getElementById('tag-options');

TAGS.forEach(tag => {
  const btn = document.createElement('button');
  btn.className = 'px-2 py-1.5 rounded text-xs bg-gray-800 hover:bg-indigo-600 text-gray-200 transition';
  btn.textContent = tag;
  btn.onclick = () => assignTag(tag);
  tagOpts.appendChild(btn);
});

function setTool(t) {
  currentTool = t;
  document.querySelectorAll('.toolbar-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('tool-'+t);
  if(btn) btn.classList.add('active');
  canvas.className = 'canvas-area flex-1 relative bg-[#0d0f1a]' + (t==='text'?' tool-text':'') + (t==='image'?' tool-image':'') + (t==='video'?' tool-video':'') + (t==='circle'?' tool-circle':'');
}

function toggleMax(id) {
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.toggle('section-maximized');
  setTimeout(()=>lucide.createIcons(), 50);
}

canvas.addEventListener('mousedown', e => {
  if(e.target.closest('#tag-popover') || e.target.closest('button') || e.target.closest('input') || e.target.closest('select') || e.target.closest('[contenteditable]') || e.target.closest('video')) return;
  popover.classList.add('hidden');
  const rect = canvas.getBoundingClientRect();
  startX = e.clientX - rect.left;
  startY = e.clientY - rect.top;

  if(currentTool === 'rect' || currentTool === 'circle') {
    drawing = true;
    currentEl = document.createElement('div');
    currentEl.className = 'drawn-el' + (currentTool==='circle'?' circle':'');
    currentEl.style.left = startX+'px'; currentEl.style.top = startY+'px';
    currentEl.style.borderColor = selectedColor;
    layer.appendChild(currentEl);
  } else if(currentTool === 'draw') {
    drawing = true;
    drawPath = [{x:startX, y:startY}];
    drawSvgPath = document.createElementNS('http://www.w3.org/2000/svg','path');
    drawSvgPath.setAttribute('fill','none');
    drawSvgPath.setAttribute('stroke', selectedColor);
    drawSvgPath.setAttribute('stroke-width','2');
    drawSvgPath.setAttribute('stroke-linecap','round');
    drawSvg.appendChild(drawSvgPath);
  } else if(currentTool === 'text') {
    placeText(startX, startY);
  } else if(currentTool === 'image') {
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='image/*';
    inp.onchange = ev => { if(ev.target.files[0]) placeImage(ev.target.files[0], startX, startY); };
    inp.click();
  } else if(currentTool === 'video') {
    videoInsertX = startX; videoInsertY = startY;
    document.getElementById('video-url-modal').classList.remove('hidden');
  }
});

canvas.addEventListener('mousemove', e => {
  if(!drawing) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if(currentTool === 'rect' || currentTool === 'circle') {
    const w = x - startX, h = y - startY;
    currentEl.style.width = Math.abs(w)+'px'; currentEl.style.height = Math.abs(h)+'px';
    currentEl.style.left = (w<0?x:startX)+'px'; currentEl.style.top = (h<0?y:startY)+'px';
  } else if(currentTool === 'draw') {
    drawPath.push({x, y});
    const d = drawPath.map((p,i) => (i===0?'M':'L')+p.x+' '+p.y).join(' ');
    drawSvgPath.setAttribute('d', d);
  }
});

canvas.addEventListener('mouseup', e => {
  if(!drawing) return;
  drawing = false;
  if(currentTool === 'rect' || currentTool === 'circle') {
    const w = parseInt(currentEl.style.width)||0, h = parseInt(currentEl.style.height)||0;
    if(w < 20 || h < 20) { currentEl.remove(); return; }
    pendingShape = {el:currentEl, x:parseInt(currentEl.style.left), y:parseInt(currentEl.style.top), w, h, shape:currentTool, color:selectedColor};
    popover.style.left = (pendingShape.x + w + 8)+'px';
    popover.style.top = pendingShape.y+'px';
    popover.classList.remove('hidden');
  } else if(currentTool === 'draw') {
    if(drawPath.length < 3) { if(drawSvgPath) drawSvgPath.remove(); return; }
    elements.push({type:'draw', path:[...drawPath], svgEl:drawSvgPath, color:selectedColor});
    drawSvgPath = null; drawPath = [];
    updateList();
  }
});

function getTextSize() { return parseInt(document.getElementById('text-size-select').value) || 16; }

function placeText(x, y) {
  const sz = getTextSize();
  const el = document.createElement('div');
  el.className = 'canvas-text';
  el.contentEditable = 'true';
  el.style.left = x+'px'; el.style.top = y+'px';
  el.style.fontSize = sz+'px';
  el.style.color = selectedColor;
  el.textContent = '';
  layer.appendChild(el);
  setTimeout(() => el.focus(), 10);
  el.addEventListener('blur', () => {
    if(!el.textContent.trim()) el.textContent = 'Text';
    el.contentEditable = 'false';
    el.style.borderStyle = 'solid';
  });
  el.addEventListener('mousedown', e => e.stopPropagation());
  el.addEventListener('click', e => { e.stopPropagation(); el.contentEditable='true'; el.style.borderStyle='dashed'; el.focus(); });
  elements.push({type:'text', el, x, y, color:selectedColor, size:sz});
  updateList();
}

function placeImage(file, x, y) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.createElement('img');
    img.className = 'canvas-img';
    img.src = ev.target.result;
    img.style.left = x+'px'; img.style.top = y+'px';
    img.style.width = '150px'; img.style.height = '120px';
    layer.appendChild(img);
    elements.push({type:'image', el:img, x, y, w:150, h:120, src:ev.target.result});
    updateList();
  };
  reader.readAsDataURL(file);
}

function placeVideo(url, x, y) {
  const vid = document.createElement('video');
  vid.className = 'canvas-video';
  vid.src = url; vid.controls = true; vid.style.left = x+'px'; vid.style.top = y+'px';
  vid.style.width = '200px'; vid.style.height = '150px';
  vid.addEventListener('mousedown', e => e.stopPropagation());
  layer.appendChild(vid);
  elements.push({type:'video', el:vid, x, y, w:200, h:150, src:url});
  updateList();
}

function closeVideoModal() { document.getElementById('video-url-modal').classList.add('hidden'); }
function confirmVideo() {
  const url = document.getElementById('video-url-input').value.trim();
  if(url) placeVideo(url, videoInsertX, videoInsertY);
  document.getElementById('video-url-input').value = '';
  closeVideoModal();
}

function handleDrop(e) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if(!file) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if(file.type.startsWith('image/')) placeImage(file, x, y);
  else if(file.type.startsWith('video/')) {
    const url = URL.createObjectURL(file);
    placeVideo(url, x, y);
  }
}

function createFunctionalContent(tag, w, h, isCircle) {
  switch(tag) {
    case 'heading': return `<div class="fn-heading" style="font-size:${Math.min(h*0.4,32)}px">Heading</div>`;
    case 'button': return `<button class="fn-button" onclick="this.textContent=this.textContent==='Clicked!'?'Click Me':'Clicked!'">Click Me</button>`;
    case 'input': return `<input class="fn-input" placeholder="Type here..." onclick="event.stopPropagation()">`;
    case 'paragraph': return `<p class="fn-paragraph">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>`;
    case 'card': return `<div class="fn-card">Card Content</div>`;
    case 'image': return `<img class="fn-image" src="https://images.pexels.com/photos/3225517/pexels-photo-3225517.jpeg?auto=compress&cs=tinysrgb&w=400" alt="placeholder">`;
    case 'video': return `<video class="fn-image" controls src=""></video>`;
    case 'checkbox': return `<label style="display:flex;align-items:center;gap:6px;color:#e0e7ff;font-size:12px"><input type="checkbox" class="fn-checkbox" onclick="event.stopPropagation()"> Check</label>`;
    case 'radio': return `<label style="display:flex;align-items:center;gap:6px;color:#e0e7ff;font-size:12px"><input type="radio" class="fn-radio" onclick="event.stopPropagation()"> Option</label>`;
    case 'dropdown': return `<select class="fn-select" onclick="event.stopPropagation()"><option>Option 1</option><option>Option 2</option><option>Option 3</option></select>`;
    case 'toggle': return `<input type="checkbox" class="fn-toggle" onclick="event.stopPropagation()">`;
    default: return `<span style="color:#a5b4fc;font-size:11px">${tag}</span>`;
  }
}

function assignTag(tag) {
  popover.classList.add('hidden');
  if(!pendingShape) return;
  pendingShape.el.classList.add('tagged');
  pendingShape.el.innerHTML = `<span class="absolute top-0 left-1 text-[9px] text-indigo-300 font-mono pointer-events-none">${tag}</span>${createFunctionalContent(tag, pendingShape.w, pendingShape.h, pendingShape.shape==='circle')}`;
  elements.push({type:'rect', ...pendingShape, tag});
  pendingShape = null;
  updateList();
}

function undoLast() {
  if(!elements.length) return;
  const last = elements.pop();
  if(last.type === 'draw') last.svgEl.remove();
  else if(last.el) last.el.remove();
  updateList();
}

function updateList() {
  const list = document.getElementById('element-list');
  document.getElementById('el-count').textContent = elements.length + ' elements';
  const icons = {heading:'H',button:'▣',input:'▭',card:'◻',image:'🖼',paragraph:'¶',draw:'✏',text:'T',video:'▶',checkbox:'☑',radio:'◉',dropdown:'▾',toggle:'⊘'};
  list.innerHTML = elements.map((el,i) => {
    const icon = el.type==='rect' ? (icons[el.tag]||'◻') : (icons[el.type]||'•');
    const label = el.type==='rect' ? el.tag : el.type;
    const dim = el.w ? `${el.w}×${el.h}` : '';
    return `<div class="flex items-center justify-between bg-gray-800/50 rounded px-2.5 py-1.5 text-xs"><span class="text-indigo-300 font-mono">${icon} ${label}</span><span class="text-gray-500">${dim}</span></div>`;
  }).join('');
}

function compile() {
  if(!elements.length) return;
  const canvasRect = canvas.getBoundingClientRect();
  const scaleX = 800/canvasRect.width, scaleY = 600/canvasRect.height;
  let css = '* { margin:0; box-sizing:border-box; }\nbody { position:relative; width:800px; height:600px; font-family:sans-serif; background:#f8fafc; }\n';
  let bodyHTML = '';
  let svgPaths = '';

  elements.forEach((el,i) => {
    if(el.type === 'rect') {
      const x=Math.round(el.x*scaleX), y=Math.round(el.y*scaleY), w=Math.round(el.w*scaleX), h=Math.round(el.h*scaleY);
      const base = `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;overflow:hidden;`;
      const isCircle = el.shape === 'circle';
      const radius = isCircle ? 'border-radius:50%;' : '';
      switch(el.tag) {
        case 'heading': css+=`.el${i}{${base}display:flex;align-items:center;justify-content:center;font-size:${Math.min(h*0.6,32)}px;font-weight:700;color:#1e293b;${radius}}\n`; bodyHTML+=`<h2 class="el${i}">Heading</h2>\n`;break;
        case 'button': css+=`.el${i}{${base}background:#6366f1;color:#fff;border:none;${isCircle?'border-radius:50%;':'border-radius:8px;'}font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;}\n.el${i}:hover{background:#4f46e5;}\n`; bodyHTML+=`<button class="el${i}">Click Me</button>\n`;break;
        case 'input': css+=`.el${i}{${base}border:1.5px solid #cbd5e1;${isCircle?'border-radius:50%;':'border-radius:6px;'}padding:0 12px;font-size:14px;outline:none;display:flex;align-items:center;}\n`; bodyHTML+=`<input class="el${i}" placeholder="Type here...">\n`;break;
        case 'card': css+=`.el${i}{${base}background:#fff;${isCircle?'border-radius:50%;':'border-radius:12px;'}box-shadow:0 2px 8px rgba(0,0,0,0.08);padding:16px;display:flex;align-items:center;justify-content:center;}\n`; bodyHTML+=`<div class="el${i}"><p style="color:#64748b;font-size:13px;">Card content</p></div>\n`;break;
        case 'image': css+=`.el${i}{${base}background:#e2e8f0;${isCircle?'border-radius:50%;':'border-radius:8px;'}}\n`; bodyHTML+=`<div class="el${i}"><img src="https://images.pexels.com/photos/3225517/pexels-photo-3225517.jpeg?auto=compress&cs=tinysrgb&w=400" style="width:100%;height:100%;object-fit:cover;${isCircle?'border-radius:50%;':''}" alt="placeholder"></div>\n`;break;
        case 'video': css+=`.el${i}{${base}background:#000;${isCircle?'border-radius:50%;':'border-radius:8px;'}}\n`; bodyHTML+=`<div class="el${i}"><video controls style="width:100%;height:100%;object-fit:cover;${isCircle?'border-radius:50%;':''}"></video></div>\n`;break;
        case 'paragraph': css+=`.el${i}{${base}font-size:13px;color:#475569;line-height:1.5;${radius}display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;}\n`; bodyHTML+=`<p class="el${i}">Lorem ipsum dolor sit amet.</p>\n`;break;
        case 'checkbox': css+=`.el${i}{${base}display:flex;align-items:center;gap:8px;justify-content:center;}\n`; bodyHTML+=`<label class="el${i}"><input type="checkbox" style="width:18px;height:18px;accent-color:#6366f1;"> Checkbox</label>\n`;break;
        case 'radio': css+=`.el${i}{${base}display:flex;align-items:center;gap:8px;justify-content:center;}\n`; bodyHTML+=`<label class="el${i}"><input type="radio" name="r" style="width:18px;height:18px;accent-color:#6366f1;"> Option</label>\n`;break;
        case 'dropdown': css+=`.el${i}{${base}display:flex;align-items:center;justify-content:center;}\n.el${i} select{width:90%;height:70%;border:1.5px solid #cbd5e1;border-radius:6px;padding:0 12px;font-size:14px;background:#fff;}\n`; bodyHTML+=`<div class="el${i}"><select><option>Option 1</option><option>Option 2</option></select></div>\n`;break;
        case 'toggle': css+=`.el${i}{${base}display:flex;align-items:center;justify-content:center;gap:8px;}\n.el${i} input[type=checkbox]{appearance:none;width:40px;height:22px;background:#cbd5e1;border-radius:11px;position:relative;cursor:pointer;transition:0.2s;}\n.el${i} input[type=checkbox]:checked{background:#6366f1;}\n.el${i} input[type=checkbox]::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:0.2s;}\n.el${i} input[type=checkbox]:checked::before{left:20px;}\n`; bodyHTML+=`<label class="el${i}"><input type="checkbox"> Toggle</label>\n`;break;
        default: css+=`.el${i}{${base}background:#e2e8f0;${radius}}\n`; bodyHTML+=`<div class="el${i}"></div>\n`;
      }
    } else if(el.type === 'draw') {
      const d = el.path.map((p,j) => (j===0?'M':'L')+Math.round(p.x*scaleX)+' '+Math.round(p.y*scaleY)).join(' ');
      svgPaths += `<path d="${d}" fill="none" stroke="${el.color||'#6366f1'}" stroke-width="2" stroke-linecap="round"/>\n`;
    } else if(el.type === 'text') {
      const x=Math.round(el.x*scaleX), y=Math.round(el.y*scaleY);
      const text = el.el.textContent || 'Text';
      css+=`.el${i}{position:absolute;left:${x}px;top:${y}px;font-size:${el.size||16}px;color:${el.color||'#1e293b'};}\n`;
      bodyHTML+=`<span class="el${i}">${text}</span>\n`;
    } else if(el.type === 'image') {
      const x=Math.round(el.x*scaleX), y=Math.round(el.y*scaleY), w=Math.round(el.w*scaleX), h=Math.round(el.h*scaleY);
      css+=`.el${i}{position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:4px;overflow:hidden;}\n`;
      bodyHTML+=`<img class="el${i}" src="${el.src}" style="width:100%;height:100%;object-fit:cover;">\n`;
    } else if(el.type === 'video') {
      const x=Math.round(el.x*scaleX), y=Math.round(el.y*scaleY), w=Math.round(el.w*scaleX), h=Math.round(el.h*scaleY);
      css+=`.el${i}{position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:4px;overflow:hidden;background:#000;}\n`;
      bodyHTML+=`<video class="el${i}" controls src="${el.src}" style="width:100%;height:100%;object-fit:cover;"></video>\n`;
    }
  });

  if(svgPaths) bodyHTML += `<svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">\n${svgPaths}</svg>\n`;

  const html = `<!DOCTYPE html>\n<html>\n<head>\n<style>\n${css}</style>\n</head>\n<body>\n${bodyHTML}</body>\n</html>`;
  document.getElementById('code-output').textContent = html;
  document.getElementById('preview-frame').srcdoc = html;
  switchTab('code');
}

function switchTab(t) {
  document.getElementById('panel-code').classList.toggle('hidden', t!=='code');
  document.getElementById('panel-preview').classList.toggle('hidden', t!=='preview');
  document.getElementById('tab-code').className = 'flex-1 py-2 text-xs font-medium '+(t==='code'?'text-indigo-400 border-b-2 border-indigo-500':'text-gray-500');
  document.getElementById('tab-preview').className = 'flex-1 py-2 text-xs font-medium '+(t==='preview'?'text-indigo-400 border-b-2 border-indigo-500':'text-gray-500');
}

function clearAll() {
  elements = [];
  layer.innerHTML = '';
  drawSvg.innerHTML = '';
  updateList();
  document.getElementById('code-output').textContent = '';
  document.getElementById('preview-frame').srcdoc = '';
}

function openShareModal() { document.getElementById('share-modal').classList.remove('hidden'); lucide.createIcons(); }
function closeShareModal() { document.getElementById('share-modal').classList.add('hidden'); }

function exportCanvas() {
  const dataStr = document.getElementById('code-output').textContent || '<p>Compile first to export</p>';
  const blob = new Blob([dataStr], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'intellicanvas-sketch.html'; a.click();
  URL.revokeObjectURL(url);
  closeShareModal();
}

function exportCode() {
  const code = document.getElementById('code-output').textContent;
  if(!code) { return; }
  const blob = new Blob([code], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'intellicanvas-code.html'; a.click();
  URL.revokeObjectURL(url);
  closeShareModal();
}

function copyCode() {
  const code = document.getElementById('code-output').textContent;
  if(code) navigator.clipboard.writeText(code);
  closeShareModal();
}

function nativeShare() {
  const code = document.getElementById('code-output').textContent || 'IntelliCanvas UI - No code generated yet';
  if(navigator.share) {
    navigator.share({title:'IntelliCanvas UI', text:code}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(code);
  }
  closeShareModal();
}
  </script>
