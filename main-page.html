<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntelliCanvas</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    body { font-family: 'Space Grotesk', sans-serif; background:#0d0f1a; color:#e0e7ff; }
    .code-block { font-family: 'Space Mono', monospace; font-size: 11px; }
    .canvas-area { cursor: crosshair; }
    .canvas-area.tool-text { cursor: text; }
    .canvas-area.tool-image { cursor: copy; }
    .canvas-area.tool-video { cursor: copy; }
    .drawn-el { position: absolute; overflow: hidden; border: 2px dashed rgba(99,102,241,0.7); background: rgba(99,102,241,0.08); display:flex; align-items:center; justify-content:center; }
    .drawn-el.tagged { border-style: solid; border-color: #6366f1; background: rgba(99,102,241,0.12); }
    .tag-popover { position: absolute; z-index: 50; }
    .preview-frame { border: 1px solid #5d7096; background: #fff; }
    .toolbar-btn { transition: all 0.15s; }
    .toolbar-btn.active { background: #6366f1 !important; color: #fff !important; }
    .canvas-text { position: absolute; background: transparent; border: 1px dashed #a5b4fc; color: #e0e7ff; padding: 4px 8px; min-width: 60px; outline: none; white-space: pre-wrap; word-break: break-word; }
    .canvas-img { position: absolute; border: 2px solid #6366f1; border-radius: 4px; object-fit: cover; }
    .canvas-video { position: absolute; border: 2px solid #6366f1; border-radius: 4px; object-fit: cover; }
    .resize-handle { position: absolute; width: 14px; height: 14px; background: #6366f1; border: 2px solid #fff; border-radius: 50%; cursor: nwse-resize; z-index: 40; box-shadow: 0 1px 4px rgba(0,0,0,0.4); display: none; }
    .resize-handle.show { display: block; }
    .size-toolbar { position: absolute; z-index: 41; background: #14162a; border: 1px solid #383c5c; border-radius: 8px; padding: 6px 8px; display: none; align-items: center; gap: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
    .size-toolbar.show { display: flex; }
    .size-toolbar input[type=number] { width: 52px; background: #1e1b4b; border: 1px solid #383c5c; border-radius: 4px; color: #e0e7ff; font-size: 11px; padding: 3px 5px; outline: none; font-family: 'Space Mono', monospace; }
    .size-toolbar span.x { color: #6b7280; font-size: 10px; }
    .size-toolbar .preset-btn { font-size: 9.5px; padding: 3px 7px; border-radius: 4px; background: #1e1b4b; color: #a5b4fc; border: 1px solid #383c5c; cursor: pointer; white-space: nowrap; }
    .size-toolbar .preset-btn:hover, .size-toolbar .preset-btn.active { background: #6366f1; color: #fff; border-color: #6366f1; }
    .ic-selected { outline: 2px solid #4DF0FF !important; outline-offset: 2px; box-shadow: 0 0 0 4px rgba(77,240,255,0.15) !important; }
    .multi-toolbar { position: absolute; z-index: 42; background: #14162a; border: 1px solid #383c5c; border-radius: 8px; padding: 6px 10px; display: none; align-items: center; gap: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); font-size: 11px; color: #a5b4fc; }
    .multi-toolbar.show { display: flex; }
    .del-btn { background: #3b1220; color: #fca5a5; border: 1px solid #5c1a2a; border-radius: 5px; padding: 4px 9px; font-size: 10.5px; cursor: pointer; }
    .del-btn:hover { background: #ef4444; color: #fff; border-color: #ef4444; }
    .ic-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(10px); z-index: 500; background: #14162a; border: 1px solid #383c5c; color: #e0e7ff; font-size: 12px; padding: 8px 16px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: all 0.25s ease; }
    .ic-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .dl-menu-wrap { position: relative; display: inline-block; }
    .dl-menu { position: absolute; top: 32px; right: 0; z-index: 60; background: #14162a; border: 1px solid #383c5c; border-radius: 8px; padding: 4px; display: none; flex-direction: column; min-width: 160px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .dl-menu.show { display: flex; }
    .dl-menu button { text-align: left; background: transparent; border: none; color: #cbd5e1; font-size: 11px; padding: 7px 10px; border-radius: 5px; cursor: pointer; }
    .dl-menu button:hover { background: #1e1b4b; color: #fff; }
    .section-maximized { position: fixed !important; inset: 0 !important; z-index: 200; width: 100vw !important; height: calc(100 * min(var(--vh,1vh),1vh)) !important; background: #10121f; overflow: auto; }
    .max-btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; background: #1e1b4b; color: #a5b4fc; border: none; font-size: 12px; }
    .max-btn:hover { background: #6366f1; color: #fff; }
    .color-swatch { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.15s; }
    .color-swatch:hover, .color-swatch.active { border-color: #fff; transform: scale(1.2); }
    .drawn-el .fn-heading { font-weight: 700; color: #e0e7ff; text-align: center; width: 100%; }
    .drawn-el .fn-button { background: #6366f1; color: #fff; border: none; border-radius: 6px; padding: 6px 16px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .drawn-el .fn-button:hover { background: #4f46e5; }
    .drawn-el .fn-input { border: 1.5px solid #cbd5e1; border-radius: 6px; padding: 6px 10px; font-size: 13px; width: 80%; background: #1e1b4b; color: #e0e7ff; outline: none; }
    .drawn-el .fn-paragraph { color: #a5b4fc; font-size: 12px; text-align: center; padding: 4px; }
    .drawn-el .fn-card { background: #1e1b4b; border-radius: 8px; width: 90%; height: 80%; display: flex; align-items: center; justify-content: center; color: #a5b4fc; font-size: 11px; }
    .drawn-el .fn-image { width: 100%; height: 100%; object-fit: cover; }
    .drawn-el .fn-checkbox, .drawn-el .fn-radio { accent-color: #6366f1; }
    .drawn-el .fn-select { border: 1.5px solid #cbd5e1; border-radius: 6px; padding: 4px 8px; font-size: 12px; background: #1e1b4b; color: #e0e7ff; }
    .drawn-el .fn-toggle { appearance: none; width: 36px; height: 20px; background: #cbd5e1; border-radius: 10px; position: relative; cursor: pointer; transition: 0.2s; }
    .drawn-el .fn-toggle:checked { background: #6366f1; }
    .drawn-el .fn-toggle::before { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: 0.2s; }
    .drawn-el .fn-toggle:checked::before { left: 18px; }
    .canva-header { background:#10121f; }
    .canva-text { color:#e0e7ff; }
    .canva-button { background:#6366f1; color:#fff; border:none; cursor:pointer; transition: background 0.15s; }
    .canva-button:hover { background:#4f46e5; }
  </style>
 </head>
 <body class="w-full min-h-screen flex flex-col overflow-hidden">
  <header class="canva-header flex items-center justify-between px-5 py-3 border-b border-gray-800">
   <h1 class="canva-text font-bold tracking-tight text-lg">IntelliCanvas</h1>
  </header>
  <main class="flex flex-1 overflow-hidden" id="main-layout">
   <section id="canvas-section" class="flex-1 relative overflow-hidden border-r border-gray-800 flex flex-col">
    <div class="flex items-center gap-1 px-3 py-2 border-b border-gray-800 bg-[#10121f] flex-wrap">
     <button class="canva-button toolbar-btn px-2.5 py-1.5 rounded text-xs font-medium" onclick="undoLast()" title="Undo (Ctrl+Z)">Undo</button>
     <button class="canva-button toolbar-btn px-2.5 py-1.5 rounded text-xs font-medium" onclick="redoLast()" title="Redo (Ctrl+Y)">Redo</button>
     <div class="w-px h-5 bg-gray-700 mx-1"></div>
     <button id="tool-draw" class="toolbar-btn px-2.5 py-1.5 rounded text-xs font-medium bg-gray-800 text-gray-300 hover:bg-gray-700 active" onclick="setTool('draw')" title="Freehand"><i data-lucide="pencil" style="width:14px;height:14px;display:inline"></i></button>
     <button id="tool-rect" class="toolbar-btn px-2.5 py-1.5 rounded text-xs font-medium bg-gray-800 text-gray-300 hover:bg-gray-700" onclick="setTool('rect')" title="Textbox / Element"><i data-lucide="square" style="width:14px;height:14px;display:inline"></i></button>
     <button id="tool-text" class="toolbar-btn px-2.5 py-1.5 rounded text-xs font-medium bg-gray-800 text-gray-300 hover:bg-gray-700" onclick="setTool('text')" title="Text"><i data-lucide="type" style="width:14px;height:14px;display:inline"></i></button>
     <button id="tool-image" class="toolbar-btn px-2.5 py-1.5 rounded text-xs font-medium bg-gray-800 text-gray-300 hover:bg-gray-700" onclick="setTool('image')" title="Image"><i data-lucide="image" style="width:14px;height:14px;display:inline"></i></button>
     <button id="tool-video" class="toolbar-btn px-2.5 py-1.5 rounded text-xs font-medium bg-gray-800 text-gray-300 hover:bg-gray-700" onclick="setTool('video')" title="Video"><i data-lucide="video" style="width:14px;height:14px;display:inline"></i></button>
     <div class="w-px h-5 bg-gray-700 mx-1"></div>
     <span class="text-[9px] text-gray-500 uppercase tracking-wide">Media shape</span>
     <button id="mshape-rect" class="toolbar-btn px-2 py-1.5 rounded text-xs font-medium bg-gray-800 text-gray-300 hover:bg-gray-700 active" onclick="setMediaShape('rect')" title="Insert image/video as rectangle"><i data-lucide="square" style="width:12px;height:12px;display:inline"></i></button>
     <button id="mshape-circle" class="toolbar-btn px-2 py-1.5 rounded text-xs font-medium bg-gray-800 text-gray-300 hover:bg-gray-700" onclick="setMediaShape('circle')" title="Insert image/video as circle"><i data-lucide="circle" style="width:12px;height:12px;display:inline"></i></button>
     <div class="w-px h-5 bg-gray-700 mx-1"></div>
     <div class="flex items-center gap-1" id="color-palette"></div>
     <div class="w-px h-5 bg-gray-700 mx-1"></div>
     <select id="text-size-select" class="bg-gray-800 text-gray-300 text-xs rounded px-2 py-1 border border-gray-700" title="Text Size">
       <option value="12">12px</option><option value="14">14px</option><option value="16" selected>16px</option>
       <option value="20">20px</option><option value="24">24px</option><option value="32">32px</option><option value="48">48px</option>
     </select>
     <div class="flex-1"></div>
     <button class="max-btn" onclick="toggleMax('canvas-section')" title="Maximize">⛶</button>
     <button class="canva-button px-3 py-1.5 rounded text-xs font-medium ml-2" onclick="clearAll()">Clear</button>
    </div>
    <div id="canvas-area" class="canvas-area flex-1 relative bg-[#0d0f1a]" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
     <svg id="grid-svg" class="absolute inset-0 w-full h-full pointer-events-none opacity-20">
      <defs>
       <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.5" />
       </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)" />
     </svg>
     <svg id="draw-svg" class="absolute inset-0 w-full h-full pointer-events-none" style="z-index:5;"></svg>
     <div id="elements-layer" class="absolute inset-0" style="z-index:10;"></div>
     <div id="media-resize-handle" class="resize-handle"></div>
     <div id="media-size-toolbar" class="size-toolbar">
      <input type="number" id="size-w-input" min="24" max="1200" title="Width (px)">
      <span class="x">×</span>
      <input type="number" id="size-h-input" min="24" max="1200" title="Height (px)">
      <span class="x">px</span>
      <button class="preset-btn" data-preset="sm">S</button>
      <button class="preset-btn" data-preset="md">M</button>
      <button class="preset-btn" data-preset="lg">L</button>
      <button class="del-btn" onclick="deleteSelected()" title="Delete (Del)">✕ Delete</button>
    </div>
    <div id="multi-select-toolbar" class="multi-toolbar">
      <span id="multi-count-label">0 selected</span>
      <button class="del-btn" onclick="deleteSelected()" title="Delete selected (Del)">✕ Delete</button>
    </div>
    </div>
    <div id="tag-popover" class="tag-popover hidden bg-gray-900 border border-gray-700 rounded-lg p-3 shadow-xl">
     <p class="text-xs text-gray-400 mb-2 font-medium">Tag this element:</p>
     <div class="grid grid-cols-3 gap-1.5" id="tag-options"></div>
    </div>
    <div id="video-url-modal" class="hidden fixed inset-0 z-[250] flex items-center justify-center bg-black/60">
     <div class="bg-gray-900 border border-gray-700 rounded-lg p-5 w-80">
      <p class="text-sm text-gray-200 mb-3 font-medium">Enter video URL (mp4, webm, or embed)</p>
      <input id="video-url-input" type="url" placeholder="https://..." class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm text-gray-200 outline-none focus:border-indigo-500 mb-3">
      <div class="flex gap-2 justify-end">
       <button class="px-3 py-1.5 rounded text-xs bg-gray-700 text-gray-300 hover:bg-gray-600" onclick="closeVideoModal()">Cancel</button>
       <button class="px-3 py-1.5 rounded text-xs bg-indigo-600 text-white hover:bg-indigo-500" onclick="confirmVideo()">Insert</button>
      </div>
     </div>
    </div>
   </section>
   <aside id="sidebar-section" class="w-[380px] flex flex-col bg-[#10121f] overflow-hidden">
    <div class="p-4 border-b border-gray-800 flex items-center justify-between">
     <h2 class="canva-text font-semibold text-sm">Layers</h2>
     <div class="flex items-center gap-2">
      <span id="el-count" class="text-xs text-indigo-400 font-mono">0 elements</span>
      <button class="max-btn" onclick="toggleMax('sidebar-section')" title="Maximize">⛶</button>
     </div>
    </div>
    <div id="element-list-section" class="flex flex-col overflow-hidden">
     <div class="flex items-center justify-between px-3 pt-2">
      <span class="text-[10px] text-gray-500 uppercase tracking-wider">Elements</span>
      <button class="max-btn" onclick="toggleMax('element-list-section')" title="Maximize" style="width:20px;height:20px;font-size:10px;">⛶</button>
     </div>
     <div id="element-list" class="overflow-y-auto p-3 space-y-1.5 max-h-[180px]"></div>
    </div>
    <div class="p-4 border-t border-gray-800">
     <button class="canva-button w-full py-2.5 rounded-lg font-semibold text-sm" onclick="compile()">Compile to Code</button>
    </div>
    <div id="code-panel-section" class="flex-1 flex flex-col overflow-hidden border-t border-gray-800">
     <div class="flex items-center border-b border-gray-800">
      <button id="tab-code" class="flex-1 py-2 text-xs font-medium text-indigo-400 border-b-2 border-indigo-500" onclick="switchTab('code')">Code</button>
      <button id="tab-preview" class="flex-1 py-2 text-xs font-medium text-gray-500" onclick="switchTab('preview')">Preview</button>
      <input type="color" id="preview-bg-input" value="#f8fafc" title="Preview background color" class="w-6 h-6 rounded border border-gray-700 bg-transparent mx-1 cursor-pointer">
      <button class="max-btn" onclick="copyCode()" title="Copy code"><i data-lucide="copy" style="width:12px;height:12px"></i></button>
      <div class="dl-menu-wrap">
       <button class="max-btn" onclick="toggleDownloadMenu()" title="Download"><i data-lucide="download" style="width:12px;height:12px"></i></button>
       <div class="dl-menu" id="download-menu">
        <button onclick="downloadCode()">⬇ Download Code (.html)</button>
        <button onclick="downloadPreview()">⬇ Download Preview (.html)</button>
       </div>
      </div>
      <button class="max-btn m-1" onclick="toggleMax('code-panel-section')" title="Maximize">⛶</button>
     </div>
     <div id="panel-code" class="flex-1 overflow-auto p-3">
      <pre id="code-output" class="code-block text-green-300 whitespace-pre-wrap text-[10px] leading-relaxed"></pre>
     </div>
     <div id="panel-preview" class="flex-1 overflow-auto p-3 hidden"><iframe id="preview-frame" class="preview-frame w-full h-full min-h-[200px] rounded"></iframe>
     </div>
    </div>
   </aside>
  </main>
  <div id="ic-toast" class="ic-toast"></div>
  <script>
lucide.createIcons();

const COLORS = ['#6366f1','#ef4444','#f59e0b','#10b981','#3b82f6','#ec4899','#8b5cf6','#06b6d4','#ffffff','#64748b'];
const palette = document.getElementById('color-palette');
let selectedColor = '#6366f1';
COLORS.forEach(c => {
  const s = document.createElement('div');
  s.className = 'color-swatch' + (c===selectedColor?' active':'');
  s.style.background = c;
  s.onclick = () => {
    palette.querySelectorAll('.color-swatch').forEach(x=>x.classList.remove('active'));
    s.classList.add('active');
    selectedColor = c;
  };
  palette.appendChild(s);
});

const TAGS = ['heading','button','input','card','image','paragraph','checkbox','radio','dropdown','toggle','video'];
let elements = [];
let elIdSeq = 1;
let currentTool = 'draw';
let mediaShape = 'rect';
let selection = new Set(); // ids of selected elements
let history = [], future = []; // undo/redo snapshot stacks
let drawing = false, startX=0, startY=0, currentEl=null, pendingShape=null;
let drawPath = [], drawSvgPath = null;
let videoInsertX=0, videoInsertY=0;

const canvas = document.getElementById('canvas-area');
const layer = document.getElementById('elements-layer');
const drawSvg = document.getElementById('draw-svg');
const popover = document.getElementById('tag-popover');
const tagOpts = document.getElementById('tag-options');

TAGS.forEach(tag => {
  const btn = document.createElement('button');
  btn.className = 'px-2 py-1.5 rounded text-xs bg-gray-800 hover:bg-indigo-600 text-gray-200 transition';
  btn.textContent = tag;
  btn.onclick = () => assignTag(tag);
  tagOpts.appendChild(btn);
});

function setTool(t) {
  currentTool = t;
  document.querySelectorAll('.toolbar-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('tool-'+t);
  if(btn) btn.classList.add('active');
  canvas.className = 'canvas-area flex-1 relative bg-[#0d0f1a]' + (t==='text'?' tool-text':'') + (t==='image'?' tool-image':'') + (t==='video'?' tool-video':'');
  clearSelection();
}

function setMediaShape(s) {
  mediaShape = s;
  document.getElementById('mshape-rect').classList.toggle('active', s==='rect');
  document.getElementById('mshape-circle').classList.toggle('active', s==='circle');
}

function toggleMax(id) {
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.toggle('section-maximized');
  setTimeout(()=>lucide.createIcons(), 50);
}

canvas.addEventListener('mousedown', e => {
  if(e.target.closest('#tag-popover') || e.target.closest('button') || e.target.closest('input') || e.target.closest('select') || e.target.closest('[contenteditable]') || e.target.closest('video') || e.target.closest('img.canvas-img') || e.target.closest('#media-resize-handle') || e.target.closest('#media-size-toolbar') || e.target.closest('#multi-select-toolbar')) return;
  popover.classList.add('hidden');
  if(!e.shiftKey) clearSelection();
  const rect = canvas.getBoundingClientRect();
  startX = e.clientX - rect.left;
  startY = e.clientY - rect.top;

  if(currentTool === 'rect') {
    drawing = true;
    currentEl = document.createElement('div');
    currentEl.className = 'drawn-el';
    currentEl.style.left = startX+'px'; currentEl.style.top = startY+'px';
    currentEl.style.borderColor = selectedColor;
    layer.appendChild(currentEl);
  } else if(currentTool === 'draw') {
    drawing = true;
    drawPath = [{x:startX, y:startY}];
    drawSvgPath = document.createElementNS('http://www.w3.org/2000/svg','path');
    drawSvgPath.setAttribute('fill','none');
    drawSvgPath.setAttribute('stroke', selectedColor);
    drawSvgPath.setAttribute('stroke-width','2');
    drawSvgPath.setAttribute('stroke-linecap','round');
    drawSvg.appendChild(drawSvgPath);
  } else if(currentTool === 'text') {
    placeText(startX, startY);
  } else if(currentTool === 'image') {
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='image/*';
    inp.onchange = ev => { if(ev.target.files[0]) placeImage(ev.target.files[0], startX, startY); };
    inp.click();
  } else if(currentTool === 'video') {
    videoInsertX = startX; videoInsertY = startY;
    document.getElementById('video-url-modal').classList.remove('hidden');
  }
});

canvas.addEventListener('mousemove', e => {
  if(!drawing) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if(currentTool === 'rect') {
    const w = x - startX, h = y - startY;
    currentEl.style.width = Math.abs(w)+'px'; currentEl.style.height = Math.abs(h)+'px';
    currentEl.style.left = (w<0?x:startX)+'px'; currentEl.style.top = (h<0?y:startY)+'px';
  } else if(currentTool === 'draw') {
    drawPath.push({x, y});
    const d = drawPath.map((p,i) => (i===0?'M':'L')+p.x+' '+p.y).join(' ');
    drawSvgPath.setAttribute('d', d);
  }
});

canvas.addEventListener('mouseup', e => {
  if(!drawing) return;
  drawing = false;
  if(currentTool === 'rect') {
    const w = parseInt(currentEl.style.width)||0, h = parseInt(currentEl.style.height)||0;
    if(w < 20 || h < 20) { currentEl.remove(); return; }
    pendingShape = {el:currentEl, x:parseInt(currentEl.style.left), y:parseInt(currentEl.style.top), w, h, color:selectedColor};
    popover.style.left = (pendingShape.x + w + 8)+'px';
    popover.style.top = pendingShape.y+'px';
    popover.classList.remove('hidden');
  } else if(currentTool === 'draw') {
    if(drawPath.length < 3) { if(drawSvgPath) drawSvgPath.remove(); return; }
    saveHistory();
    elements.push({id:elIdSeq++, type:'draw', path:[...drawPath], svgEl:drawSvgPath, color:selectedColor});
    drawSvgPath = null; drawPath = [];
    updateList();
  }
});

function getTextSize() { return parseInt(document.getElementById('text-size-select').value) || 16; }

function placeText(x, y) {
  const sz = getTextSize();
  const el = document.createElement('div');
  el.className = 'canvas-text';
  el.contentEditable = 'true';
  el.style.left = x+'px'; el.style.top = y+'px';
  el.style.fontSize = sz+'px';
  el.style.color = selectedColor;
  el.textContent = '';
  layer.appendChild(el);
  setTimeout(() => el.focus(), 10);
  el.addEventListener('blur', () => {
    if(!el.textContent.trim()) el.textContent = 'Text';
    el.contentEditable = 'false';
    el.style.borderStyle = 'solid';
  });
  saveHistory();
  const entry = {id:elIdSeq++, type:'text', el, x, y, color:selectedColor, size:sz};
  elements.push(entry);
  makeSelectableAndDraggable(el, entry);
  el.addEventListener('dblclick', e => { e.stopPropagation(); el.contentEditable='true'; el.style.borderStyle='dashed'; el.focus(); });
  updateList();
}

function placeImage(file, x, y) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.createElement('img');
    img.className = 'canvas-img';
    img.src = ev.target.result;
    img.style.left = x+'px'; img.style.top = y+'px';
    img.style.width = '150px'; img.style.height = '120px';
    if(mediaShape === 'circle') img.style.borderRadius = '50%';
    layer.appendChild(img);
    saveHistory();
    const entry = {id:elIdSeq++, type:'image', el:img, x, y, w:150, h:120, src:ev.target.result, shape:mediaShape};
    elements.push(entry);
    makeSelectableAndDraggable(img, entry);
    updateList();
  };
  reader.readAsDataURL(file);
}

function placeVideo(url, x, y) {
  const vid = document.createElement('video');
  vid.className = 'canvas-video';
  vid.src = url; vid.controls = true; vid.style.left = x+'px'; vid.style.top = y+'px';
  vid.style.width = '200px'; vid.style.height = '150px';
  if(mediaShape === 'circle') vid.style.borderRadius = '50%';
  layer.appendChild(vid);
  saveHistory();
  const entry = {id:elIdSeq++, type:'video', el:vid, x, y, w:200, h:150, src:url, shape:mediaShape};
  elements.push(entry);
  makeSelectableAndDraggable(vid, entry);
  updateList();
}

function closeVideoModal() { document.getElementById('video-url-modal').classList.add('hidden'); }
function confirmVideo() {
  const url = document.getElementById('video-url-input').value.trim();
  if(url) placeVideo(url, videoInsertX, videoInsertY);
  document.getElementById('video-url-input').value = '';
  closeVideoModal();
}

/* ===================== Unified selection / drag / resize / multiselect / history ===================== */
const mediaHandle = document.getElementById('media-resize-handle');
const sizeToolbar = document.getElementById('media-size-toolbar');
const sizeWInput = document.getElementById('size-w-input');
const sizeHInput = document.getElementById('size-h-input');
const multiToolbar = document.getElementById('multi-select-toolbar');
const multiCountLabel = document.getElementById('multi-count-label');
let resizing = false, resizeStartX=0, resizeStartY=0, resizeStartW=0, resizeStartH=0;
let draggingEls = false, dragStartX=0, dragStartY=0, dragOrigins=null;
const DRAG_THRESHOLD = 3;

const SIZE_PRESETS = {
  image: { sm:{w:100,h:80}, md:{w:220,h:160}, lg:{w:380,h:280} },
  video: { sm:{w:160,h:100}, md:{w:280,h:180}, lg:{w:440,h:280} },
  rect:  { sm:{w:80,h:60},  md:{w:160,h:120}, lg:{w:280,h:200} },
};

function findEntry(id) { return elements.find(e => e.id === id); }

function makeSelectableAndDraggable(el, entry) {
  el.addEventListener('mousedown', e => {
    e.stopPropagation();
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.isContentEditable) return;
    if(!selection.has(entry.id)) {
      if(!e.shiftKey) clearSelection();
      selection.add(entry.id);
      refreshSelectionVisuals();
    }
    // prime a possible drag
    draggingEls = false;
    dragStartX = e.clientX; dragStartY = e.clientY;
    dragOrigins = [...selection].map(id => { const en = findEntry(id); return {id, x:en.x, y:en.y}; });
    let historySaved = false;
    const onMove = (ev) => {
      const dx = ev.clientX - dragStartX, dy = ev.clientY - dragStartY;
      if(!draggingEls && Math.hypot(dx,dy) > DRAG_THRESHOLD) {
        draggingEls = true;
        if(!historySaved) { saveHistory(); historySaved = true; }
      }
      if(draggingEls) {
        dragOrigins.forEach(o => {
          const en = findEntry(o.id);
          if(!en || !en.el) return;
          en.x = o.x + dx; en.y = o.y + dy;
          en.el.style.left = en.x+'px'; en.el.style.top = en.y+'px';
        });
        positionResizeChrome();
        positionMultiToolbar();
      }
    };
    const onUp = () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      if(draggingEls) { updateList(); syncPreviewIfOpen(); }
      draggingEls = false;
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  });
  el.addEventListener('click', e => e.stopPropagation());
}

function refreshSelectionVisuals() {
  elements.forEach(entry => {
    if(!entry.el) return;
    entry.el.classList.toggle('ic-selected', selection.has(entry.id));
  });
  mediaHandle.classList.remove('show');
  sizeToolbar.classList.remove('show');
  multiToolbar.classList.remove('show');

  if(selection.size === 1) {
    const entry = findEntry([...selection][0]);
    if(entry && entry.w !== undefined) {
      sizeWInput.value = entry.w;
      sizeHInput.value = entry.h;
      mediaHandle.classList.add('show');
      sizeToolbar.classList.add('show');
      positionResizeChrome();
    } else if(entry) {
      // selectable but not resizable (e.g. text) — still offer delete
      multiToolbar.classList.add('show');
      multiCountLabel.textContent = entry.type;
      positionMultiToolbar();
    }
  } else if(selection.size > 1) {
    multiToolbar.classList.add('show');
    multiCountLabel.textContent = selection.size + ' selected';
    positionMultiToolbar();
  }
}

function clearSelection() {
  selection.clear();
  refreshSelectionVisuals();
}

function selectionBounds() {
  const entries = [...selection].map(findEntry).filter(Boolean);
  if(!entries.length) return null;
  const xs = entries.map(e => e.x), ys = entries.map(e => e.y);
  const xe = entries.map(e => e.x + (e.w||60)), ye = entries.map(e => e.y + (e.h||24));
  return { x: Math.min(...xs), y: Math.min(...ys), maxX: Math.max(...xe), maxY: Math.max(...ye) };
}

function positionResizeChrome() {
  if(selection.size !== 1) return;
  const entry = findEntry([...selection][0]);
  if(!entry || entry.w === undefined) return;
  mediaHandle.style.left = (entry.x + entry.w - 7) + 'px';
  mediaHandle.style.top = (entry.y + entry.h - 7) + 'px';
  let tbX = entry.x, tbY = entry.y - 40;
  if(tbY < 0) tbY = entry.y + entry.h + 8;
  sizeToolbar.style.left = tbX + 'px';
  sizeToolbar.style.top = tbY + 'px';
}

function positionMultiToolbar() {
  const b = selectionBounds();
  if(!b) return;
  let tbY = b.y - 38;
  if(tbY < 0) tbY = b.maxY + 8;
  multiToolbar.style.left = b.x + 'px';
  multiToolbar.style.top = tbY + 'px';
}

function applyMediaSize(entry, el, w, h) {
  w = Math.max(24, Math.round(w));
  h = Math.max(24, Math.round(h));
  entry.w = w; entry.h = h;
  el.style.width = w + 'px';
  el.style.height = h + 'px';
  sizeWInput.value = w;
  sizeHInput.value = h;
  positionResizeChrome();
  updateList();
  syncPreviewIfOpen();
}

mediaHandle.addEventListener('mousedown', e => {
  if(selection.size !== 1) return;
  const entry = findEntry([...selection][0]);
  if(!entry) return;
  e.preventDefault(); e.stopPropagation();
  saveHistory();
  resizing = true;
  resizeStartX = e.clientX; resizeStartY = e.clientY;
  resizeStartW = entry.w; resizeStartH = entry.h;
});

window.addEventListener('mousemove', e => {
  if(!resizing || selection.size !== 1) return;
  const entry = findEntry([...selection][0]);
  if(!entry) return;
  const dx = e.clientX - resizeStartX, dy = e.clientY - resizeStartY;
  applyMediaSize(entry, entry.el, resizeStartW + dx, resizeStartH + dy);
});
window.addEventListener('mouseup', () => {
  if(resizing) syncPreviewIfOpen();
  resizing = false;
});

sizeWInput.addEventListener('input', () => {
  if(selection.size !== 1) return;
  const entry = findEntry([...selection][0]);
  if(!entry) return;
  applyMediaSize(entry, entry.el, parseInt(sizeWInput.value)||entry.w, entry.h);
});
sizeHInput.addEventListener('input', () => {
  if(selection.size !== 1) return;
  const entry = findEntry([...selection][0]);
  if(!entry) return;
  applyMediaSize(entry, entry.el, entry.w, parseInt(sizeHInput.value)||entry.h);
});
sizeWInput.addEventListener('mousedown', e => e.stopPropagation());
sizeHInput.addEventListener('mousedown', e => e.stopPropagation());

sizeToolbar.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('mousedown', e => e.stopPropagation());
  btn.addEventListener('click', e => {
    e.stopPropagation();
    if(selection.size !== 1) return;
    const entry = findEntry([...selection][0]);
    if(!entry) return;
    const presets = SIZE_PRESETS[entry.type] || SIZE_PRESETS.rect;
    const preset = presets[btn.dataset.preset];
    sizeToolbar.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    saveHistory();
    applyMediaSize(entry, entry.el, preset.w, preset.h);
  });
});

function deleteSelected() {
  if(!selection.size) return;
  saveHistory();
  elements = elements.filter(entry => {
    if(selection.has(entry.id)) {
      if(entry.type === 'draw') { if(entry.svgEl) entry.svgEl.remove(); }
      else if(entry.el) entry.el.remove();
      return false;
    }
    return true;
  });
  clearSelection();
  updateList();
  syncPreviewIfOpen();
}

document.addEventListener('keydown', e => {
  const activeTag = document.activeElement && document.activeElement.tagName;
  const isEditing = document.activeElement && (document.activeElement.isContentEditable || activeTag==='INPUT' || activeTag==='TEXTAREA');
  if(isEditing) return;
  if((e.key === 'Delete' || e.key === 'Backspace') && selection.size) {
    e.preventDefault();
    deleteSelected();
  } else if(e.key === 'Escape') {
    clearSelection();
    popover.classList.add('hidden');
  } else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if(e.shiftKey) redoLast(); else undoLast();
  } else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
    e.preventDefault();
    redoLast();
  }
});

/* ---------- Undo / Redo (full-state snapshot history) ---------- */
function snapshotState() {
  return elements.map(entry => {
    const base = {id:entry.id, type:entry.type, x:entry.x, y:entry.y, w:entry.w, h:entry.h, color:entry.color, shape:entry.shape};
    if(entry.type === 'rect') return {...base, tag:entry.tag};
    if(entry.type === 'text') return {...base, size:entry.size, text: entry.el ? entry.el.textContent : 'Text'};
    if(entry.type === 'image' || entry.type === 'video') return {...base, src:entry.src};
    if(entry.type === 'draw') return {...base, path:[...entry.path]};
    return base;
  });
}

function rebuildFromSnapshot(snap) {
  layer.innerHTML = '';
  drawSvg.innerHTML = '';
  elements = [];
  clearSelection();
  snap.forEach(s => {
    if(s.type === 'rect') {
      const el = document.createElement('div');
      el.className = 'drawn-el tagged';
      el.style.left = s.x+'px'; el.style.top = s.y+'px'; el.style.width = s.w+'px'; el.style.height = s.h+'px';
      el.style.borderColor = s.color;
      el.innerHTML = `<span class="absolute top-0 left-1 text-[9px] text-indigo-300 font-mono pointer-events-none">${s.tag}</span>${createFunctionalContent(s.tag, s.w, s.h)}`;
      layer.appendChild(el);
      const entry = {id:s.id, type:'rect', el, x:s.x, y:s.y, w:s.w, h:s.h, color:s.color, tag:s.tag};
      elements.push(entry);
      makeSelectableAndDraggable(el, entry);
    } else if(s.type === 'text') {
      const el = document.createElement('div');
      el.className = 'canvas-text';
      el.contentEditable = 'false';
      el.style.left = s.x+'px'; el.style.top = s.y+'px'; el.style.fontSize = (s.size||16)+'px'; el.style.color = s.color;
      el.style.borderStyle = 'solid';
      el.textContent = s.text || 'Text';
      el.addEventListener('blur', () => { if(!el.textContent.trim()) el.textContent = 'Text'; el.contentEditable='false'; el.style.borderStyle='solid'; });
      el.addEventListener('dblclick', e => { e.stopPropagation(); el.contentEditable='true'; el.style.borderStyle='dashed'; el.focus(); });
      layer.appendChild(el);
      const entry = {id:s.id, type:'text', el, x:s.x, y:s.y, color:s.color, size:s.size};
      elements.push(entry);
      makeSelectableAndDraggable(el, entry);
    } else if(s.type === 'image') {
      const el = document.createElement('img');
      el.className = 'canvas-img';
      el.src = s.src;
      el.style.left = s.x+'px'; el.style.top = s.y+'px'; el.style.width = s.w+'px'; el.style.height = s.h+'px';
      if(s.shape === 'circle') el.style.borderRadius = '50%';
      layer.appendChild(el);
      const entry = {id:s.id, type:'image', el, x:s.x, y:s.y, w:s.w, h:s.h, src:s.src, shape:s.shape};
      elements.push(entry);
      makeSelectableAndDraggable(el, entry);
    } else if(s.type === 'video') {
      const el = document.createElement('video');
      el.className = 'canvas-video';
      el.src = s.src; el.controls = true;
      el.style.left = s.x+'px'; el.style.top = s.y+'px'; el.style.width = s.w+'px'; el.style.height = s.h+'px';
      if(s.shape === 'circle') el.style.borderRadius = '50%';
      layer.appendChild(el);
      const entry = {id:s.id, type:'video', el, x:s.x, y:s.y, w:s.w, h:s.h, src:s.src, shape:s.shape};
      elements.push(entry);
      makeSelectableAndDraggable(el, entry);
    } else if(s.type === 'draw') {
      const d = s.path.map((p,j) => (j===0?'M':'L')+p.x+' '+p.y).join(' ');
      const svgEl = document.createElementNS('http://www.w3.org/2000/svg','path');
      svgEl.setAttribute('d', d); svgEl.setAttribute('fill','none');
      svgEl.setAttribute('stroke', s.color||'#6366f1'); svgEl.setAttribute('stroke-width','2'); svgEl.setAttribute('stroke-linecap','round');
      drawSvg.appendChild(svgEl);
      elements.push({id:s.id, type:'draw', path:[...s.path], svgEl, color:s.color});
    }
  });
  updateList();
  syncPreviewIfOpen();
}

function saveHistory() {
  history.push(snapshotState());
  if(history.length > 60) history.shift();
  future = [];
}

function undoLast() {
  if(!history.length) return;
  future.push(snapshotState());
  const prev = history.pop();
  rebuildFromSnapshot(prev);
}

function redoLast() {
  if(!future.length) return;
  history.push(snapshotState());
  const next = future.pop();
  rebuildFromSnapshot(next);
}

function handleDrop(e) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if(!file) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if(file.type.startsWith('image/')) placeImage(file, x, y);
  else if(file.type.startsWith('video/')) {
    const url = URL.createObjectURL(file);
    placeVideo(url, x, y);
  }
}

function createFunctionalContent(tag, w, h) {
  const stop = 'onclick="event.stopPropagation()" onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}"';
  switch(tag) {
    case 'heading': return `<div class="fn-heading" contenteditable="true" ${stop} style="font-size:${Math.min(h*0.4,32)}px">Heading</div>`;
    case 'button': return `<button class="fn-button" contenteditable="true" ${stop}>Click Me</button>`;
    case 'input': return `<input class="fn-input" placeholder="Type here..." onclick="event.stopPropagation()">`;
    case 'paragraph': return `<p class="fn-paragraph" contenteditable="true" onclick="event.stopPropagation()">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>`;
    case 'card': return `<div class="fn-card" contenteditable="true" ${stop}>Card Content</div>`;
    case 'image': return `<img class="fn-image" src="https://images.pexels.com/photos/3225517/pexels-photo-3225517.jpeg?auto=compress&cs=tinysrgb&w=400" alt="placeholder">`;
    case 'video': return `<video class="fn-image" controls src=""></video>`;
    case 'checkbox': return `<label style="display:flex;align-items:center;gap:6px;color:#e0e7ff;font-size:12px"><input type="checkbox" class="fn-checkbox" onclick="event.stopPropagation()"> <span class="fn-label" contenteditable="true" ${stop}>Check</span></label>`;
    case 'radio': return `<label style="display:flex;align-items:center;gap:6px;color:#e0e7ff;font-size:12px"><input type="radio" class="fn-radio" onclick="event.stopPropagation()"> <span class="fn-label" contenteditable="true" ${stop}>Option</span></label>`;
    case 'dropdown': return `<select class="fn-select" onclick="event.stopPropagation()"><option>Option 1</option><option>Option 2</option><option>Option 3</option></select>`;
    case 'toggle': return `<label style="display:flex;align-items:center;gap:6px;color:#e0e7ff;font-size:12px"><input type="checkbox" class="fn-toggle" onclick="event.stopPropagation()"> <span class="fn-label" contenteditable="true" ${stop}>Toggle</span></label>`;
    default: return `<span style="color:#a5b4fc;font-size:11px">${tag}</span>`;
  }
}

function assignTag(tag) {
  popover.classList.add('hidden');
  if(!pendingShape) return;
  pendingShape.el.classList.add('tagged');
  pendingShape.el.innerHTML = `<span class="absolute top-0 left-1 text-[9px] text-indigo-300 font-mono pointer-events-none">${tag}</span>${createFunctionalContent(tag, pendingShape.w, pendingShape.h)}`;
  saveHistory();
  const entry = {id:elIdSeq++, type:'rect', el:pendingShape.el, x:pendingShape.x, y:pendingShape.y, w:pendingShape.w, h:pendingShape.h, color:pendingShape.color, tag};
  elements.push(entry);
  makeSelectableAndDraggable(pendingShape.el, entry);
  pendingShape = null;
  updateList();
}

function updateList() {
  const list = document.getElementById('element-list');
  document.getElementById('el-count').textContent = elements.length + ' elements';
  const icons = {heading:'H',button:'▣',input:'▭',card:'◻',image:'🖼',paragraph:'¶',draw:'✏',text:'T',video:'▶',checkbox:'☑',radio:'◉',dropdown:'▾',toggle:'⊘'};
  list.innerHTML = elements.map((el,i) => {
    const icon = el.type==='rect' ? (icons[el.tag]||'◻') : (icons[el.type]||'•');
    const label = el.type==='rect' ? el.tag : el.type;
    const dim = el.w ? `${el.w}×${el.h}` : '';
    return `<div class="flex items-center justify-between bg-gray-800/50 rounded px-2.5 py-1.5 text-xs"><span class="text-indigo-300 font-mono">${icon} ${label}</span><span class="text-gray-500">${dim}</span></div>`;
  }).join('');
}

let previewBg = '#f8fafc';
document.getElementById('preview-bg-input').addEventListener('input', e => {
  previewBg = e.target.value;
  syncPreviewIfOpen();
});

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function textOf(container, selector, fallback) {
  const node = container ? container.querySelector(selector) : null;
  const t = node ? (node.textContent || '').trim() : '';
  return escapeHtml(t || fallback);
}

function buildHTML() {
  const canvasRect = canvas.getBoundingClientRect();
  const scaleX = 800/canvasRect.width, scaleY = 600/canvasRect.height;
  let css = `* { margin:0; box-sizing:border-box; }\nbody { position:relative; width:800px; height:600px; font-family:sans-serif; background:${previewBg}; }\n`;
  let bodyHTML = '';
  let svgPaths = '';

  elements.forEach((el,i) => {
    if(el.type === 'rect') {
      const x=Math.round(el.x*scaleX), y=Math.round(el.y*scaleY), w=Math.round(el.w*scaleX), h=Math.round(el.h*scaleY);
      const base = `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;overflow:hidden;`;
      switch(el.tag) {
        case 'heading': css+=`.el${i}{${base}display:flex;align-items:center;justify-content:center;font-size:${Math.min(h*0.6,32)}px;font-weight:700;color:#1e293b;}\n`; bodyHTML+=`<h2 class="el${i}">${textOf(el.el,'.fn-heading','Heading')}</h2>\n`;break;
        case 'button': css+=`.el${i}{${base}background:#6366f1;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;}\n.el${i}:hover{background:#4f46e5;}\n`; bodyHTML+=`<button class="el${i}">${textOf(el.el,'.fn-button','Click Me')}</button>\n`;break;
        case 'input': { const iv = el.el.querySelector('.fn-input'); const val = iv && iv.value ? ` value="${escapeHtml(iv.value)}"` : ''; css+=`.el${i}{${base}border:1.5px solid #cbd5e1;border-radius:6px;padding:0 12px;font-size:14px;outline:none;display:flex;align-items:center;}\n`; bodyHTML+=`<input class="el${i}" placeholder="Type here..."${val}>\n`;break; }
        case 'card': css+=`.el${i}{${base}background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);padding:16px;display:flex;align-items:center;justify-content:center;}\n`; bodyHTML+=`<div class="el${i}"><p style="color:#64748b;font-size:13px;">${textOf(el.el,'.fn-card','Card content')}</p></div>\n`;break;
        case 'image': css+=`.el${i}{${base}background:#e2e8f0;border-radius:8px;}\n`; bodyHTML+=`<div class="el${i}"><img src="https://images.pexels.com/photos/3225517/pexels-photo-3225517.jpeg?auto=compress&cs=tinysrgb&w=400" style="width:100%;height:100%;object-fit:cover;" alt="placeholder"></div>\n`;break;
        case 'video': css+=`.el${i}{${base}background:#000;border-radius:8px;}\n`; bodyHTML+=`<div class="el${i}"><video controls style="width:100%;height:100%;object-fit:cover;"></video></div>\n`;break;
        case 'paragraph': css+=`.el${i}{${base}font-size:13px;color:#475569;line-height:1.5;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;}\n`; bodyHTML+=`<p class="el${i}">${textOf(el.el,'.fn-paragraph','Lorem ipsum dolor sit amet.')}</p>\n`;break;
        case 'checkbox': css+=`.el${i}{${base}display:flex;align-items:center;gap:8px;justify-content:center;}\n`; bodyHTML+=`<label class="el${i}"><input type="checkbox" style="width:18px;height:18px;accent-color:#6366f1;"> ${textOf(el.el,'.fn-label','Checkbox')}</label>\n`;break;
        case 'radio': css+=`.el${i}{${base}display:flex;align-items:center;gap:8px;justify-content:center;}\n`; bodyHTML+=`<label class="el${i}"><input type="radio" name="r" style="width:18px;height:18px;accent-color:#6366f1;"> ${textOf(el.el,'.fn-label','Option')}</label>\n`;break;
        case 'dropdown': css+=`.el${i}{${base}display:flex;align-items:center;justify-content:center;}\n.el${i} select{width:90%;height:70%;border:1.5px solid #cbd5e1;border-radius:6px;padding:0 12px;font-size:14px;background:#fff;}\n`; bodyHTML+=`<div class="el${i}"><select><option>Option 1</option><option>Option 2</option></select></div>\n`;break;
        case 'toggle': css+=`.el${i}{${base}display:flex;align-items:center;justify-content:center;gap:8px;}\n.el${i} input[type=checkbox]{appearance:none;width:40px;height:22px;background:#cbd5e1;border-radius:11px;position:relative;cursor:pointer;transition:0.2s;}\n.el${i} input[type=checkbox]:checked{background:#6366f1;}\n.el${i} input[type=checkbox]::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:0.2s;}\n.el${i} input[type=checkbox]:checked::before{left:20px;}\n`; bodyHTML+=`<label class="el${i}"><input type="checkbox"> ${textOf(el.el,'.fn-label','Toggle')}</label>\n`;break;
        default: css+=`.el${i}{${base}background:#e2e8f0;}\n`; bodyHTML+=`<div class="el${i}"></div>\n`;
      }
    } else if(el.type === 'draw') {
      const d = el.path.map((p,j) => (j===0?'M':'L')+Math.round(p.x*scaleX)+' '+Math.round(p.y*scaleY)).join(' ');
      svgPaths += `<path d="${d}" fill="none" stroke="${el.color||'#6366f1'}" stroke-width="2" stroke-linecap="round"/>\n`;
    } else if(el.type === 'text') {
      const x=Math.round(el.x*scaleX), y=Math.round(el.y*scaleY);
      const text = el.el.textContent || 'Text';
      css+=`.el${i}{position:absolute;left:${x}px;top:${y}px;font-size:${el.size||16}px;color:${el.color||'#1e293b'};}\n`;
      bodyHTML+=`<span class="el${i}">${text}</span>\n`;
    } else if(el.type === 'image') {
      const x=Math.round(el.x*scaleX), y=Math.round(el.y*scaleY), w=Math.round(el.w*scaleX), h=Math.round(el.h*scaleY);
      const radius = el.shape === 'circle' ? '50%' : '4px';
      css+=`.el${i}{position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${radius};overflow:hidden;}\n`;
      bodyHTML+=`<img class="el${i}" src="${el.src}" style="width:100%;height:100%;object-fit:cover;">\n`;
    } else if(el.type === 'video') {
      const x=Math.round(el.x*scaleX), y=Math.round(el.y*scaleY), w=Math.round(el.w*scaleX), h=Math.round(el.h*scaleY);
      const radius = el.shape === 'circle' ? '50%' : '4px';
      css+=`.el${i}{position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${radius};overflow:hidden;background:#000;}\n`;
      bodyHTML+=`<video class="el${i}" controls src="${el.src}" style="width:100%;height:100%;object-fit:cover;"></video>\n`;
    }
  });

  if(svgPaths) bodyHTML += `<svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">\n${svgPaths}</svg>\n`;

  return `<!DOCTYPE html>\n<html>\n<head>\n<style>\n${css}</style>\n</head>\n<body>\n${bodyHTML}</body>\n</html>`;
}

function compile() {
  if(!elements.length) return;
  const html = buildHTML();
  document.getElementById('code-output').textContent = html;
  document.getElementById('preview-frame').srcdoc = html;
  switchTab('code');
}

// Silent recompile used after a resize/move/color change — updates code + preview
// without yanking the user back to the Code tab if they're looking at Preview.
function syncPreviewIfOpen() {
  const previewFrame = document.getElementById('preview-frame');
  if(!previewFrame || !previewFrame.srcdoc || !elements.length) return;
  const html = buildHTML();
  document.getElementById('code-output').textContent = html;
  previewFrame.srcdoc = html;
}

function switchTab(t) {
  document.getElementById('panel-code').classList.toggle('hidden', t!=='code');
  document.getElementById('panel-preview').classList.toggle('hidden', t!=='preview');
  document.getElementById('tab-code').className = 'flex-1 py-2 text-xs font-medium '+(t==='code'?'text-indigo-400 border-b-2 border-indigo-500':'text-gray-500');
  document.getElementById('tab-preview').className = 'flex-1 py-2 text-xs font-medium '+(t==='preview'?'text-indigo-400 border-b-2 border-indigo-500':'text-gray-500');
}

function clearAll() {
  saveHistory();
  elements = [];
  layer.innerHTML = '';
  drawSvg.innerHTML = '';
  clearSelection();
  updateList();
  document.getElementById('code-output').textContent = '';
  document.getElementById('preview-frame').srcdoc = '';
}

function showToast(msg) {
  const t = document.getElementById('ic-toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function getCompiledCode() {
  // Always generate fresh from current canvas state so Copy/Download never
  // rely on the user having pressed "Compile to Code" first.
  if(!elements.length) return '';
  const html = buildHTML();
  document.getElementById('code-output').textContent = html;
  const previewFrame = document.getElementById('preview-frame');
  if(previewFrame.srcdoc) previewFrame.srcdoc = html;
  return html;
}

function downloadFile(content, filename) {
  const blob = new Blob([content], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function copyCode() {
  const code = getCompiledCode();
  if(!code) { showToast('Nothing to copy yet — sketch something first'); return; }
  const doCopy = navigator.clipboard && navigator.clipboard.writeText
    ? navigator.clipboard.writeText(code)
    : Promise.reject();
  doCopy.then(() => showToast('Code copied to clipboard')).catch(() => {
    // Fallback for browsers/contexts without Clipboard API access
    const ta = document.createElement('textarea');
    ta.value = code; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('Code copied to clipboard'); }
    catch(e) { showToast('Copy failed — select and copy manually'); }
    document.body.removeChild(ta);
  });
}

function toggleDownloadMenu() {
  document.getElementById('download-menu').classList.toggle('show');
}
document.addEventListener('click', e => {
  if(!e.target.closest('.dl-menu-wrap')) document.getElementById('download-menu').classList.remove('show');
});

function downloadCode() {
  const code = getCompiledCode();
  if(!code) { showToast('Nothing to download yet — sketch something first'); return; }
  downloadFile(code, 'intellicanvas-code.html');
  document.getElementById('download-menu').classList.remove('show');
  showToast('Code downloaded');
}

function downloadPreview() {
  const code = getCompiledCode();
  if(!code) { showToast('Nothing to download yet — sketch something first'); return; }
  downloadFile(code, 'intellicanvas-preview.html');
  document.getElementById('download-menu').classList.remove('show');
  showToast('Preview downloaded');
}
